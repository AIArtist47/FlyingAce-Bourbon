<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flying Ace Farm - Age Gate (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=Newsreader:ital,opsz@1,6..72&amp;display=swap">
<style>
body{margin:0;background:#F4EEE3}
a{color:#9A2A22;text-decoration:none}a:hover{color:#6E1D17}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #F4EEE3; color: #18212C; font-family: 'Libre Franklin', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<section style="height: 844px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: 0"><img src="/_blob/fd34841dc270678d7e44db2abcb8a5be" alt="Flying Ace Farm" style="height: 844px; width: 100%; display: block; object-fit: cover;"></div>
<div style="position: absolute; inset: 0; background: rgba(14, 20, 28, 0.78)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="gate-title" style="position: relative; width: calc(100% - 40px); box-sizing: border-box; padding: 36px 24px; background: #F4EEE3; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; border-top: 6px solid {{accent}}">
<img src="/_blob/06cebeb2d0852bc905825269e20e9571" alt="" style="width: 60px; height: 60px; display: block; flex-shrink: 0; object-fit: contain; background: #18212C; border-radius: 50%; box-sizing: border-box; padding: 5px;">
<div style="font-family: 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase; font-weight: 800; font-size: 18px; letter-spacing: 0.14em">Flying Ace Farm</div>
<sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%">
<h1 id="gate-title" style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase; font-weight: 800; font-size: 44px; line-height: 0.95; color: #18212C; line-height: 0.95;">Are you 21 or older?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4F57;  ">You must be of legal drinking age to enter this site.</p>
<div style="display: flex; flex-direction: column; gap: 12px; width: 100%">
<a href="Main.dc.html" style="flex: 1; height: 56px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase">Yes, I’m 21+</a>
<button type="button" onClick="{{ deny }}" style="flex: 1; height: 56px; border: 1.5px solid #18212C; background: transparent; color: #18212C; font-family: inherit; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer">No</button>
</div>
</div>
</sc-if>
<sc-if value="{{ denied }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%">
<h1 style="margin: 0; font-family: 'Big Shoulders Display', Impact, sans-serif; text-transform: uppercase; font-weight: 800; font-size: 36px; line-height: 0.95; color: #18212C; ">Sorry - come back when you’re 21</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4F57;  ">This site features alcoholic beverages and is intended for guests of legal drinking age.</p>
<button type="button" onClick="{{ back }}" style="height: 48px; padding: 0 22px; border: 1.5px solid #18212C; background: transparent; color: #18212C; font-family: inherit; font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer">I entered the wrong answer</button>
</div>
</sc-if>
<div style="font-size: 12px; line-height: 1.5; color: #5A5F66; border-top: 1px solid #D8CDB9; padding-top: 16px; width: 100%">Please enjoy American Ace Spirits and Flying Ace beer responsibly.</div>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9A2A22","options":["#9A2A22","#1F4E79","#8A5A1C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const denied = !!(this.state && this.state.denied);
    return {
      accent: this.props.accent ?? '#9A2A22',
      denied: denied,
      asking: !denied,
      deny: () => this.setState({ denied: true }),
      back: () => this.setState({ denied: false })
    };
  }
}
</script>
</body>
</html>
